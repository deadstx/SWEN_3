services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: documentdb
      POSTGRES_USER: documentuser
      POSTGRES_PASSWORD: documentpass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./swen3-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/documentdb
      SPRING_DATASOURCE_USERNAME: documentuser
      SPRING_DATASOURCE_PASSWORD: documentpass
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  frontend:
    build: ./swen3-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
