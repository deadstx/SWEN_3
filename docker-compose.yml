services:
  rustfs-init:
    image: busybox:1.37
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data /logs"]
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-paperlessadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-paperless-local-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: documentdb
      POSTGRES_USER: documentuser
      POSTGRES_PASSWORD: documentpass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./swen3-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/documentdb
      SPRING_DATASOURCE_USERNAME: documentuser
      SPRING_DATASOURCE_PASSWORD: documentpass
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-paperlessadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-paperless-local-secret}
      STORAGE_BUCKET: documents
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    ports:
      - "8081:8080"
    depends_on:
      rustfs:
        condition: service_healthy
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  ocr-worker:
    build: ./swen3-ocr-worker
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./swen3-frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  rustfs-data:
  rustfs-logs:
  postgres-data:
