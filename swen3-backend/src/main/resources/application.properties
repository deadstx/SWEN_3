spring.application.name= swen3-backend
spring.datasource.url= ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/documentdb}
spring.datasource.username= ${SPRING_DATASOURCE_USERNAME:documentuser}
spring.datasource.password= ${SPRING_DATASOURCE_PASSWORD:documentpass}
spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql= true
spring.jpa.properties.hibernate.format_sql= true
server.port= 8080