spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.jpa.open-in-view=false
spring.application.name= swen3-backend
spring.datasource.url= ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/documentdb}
spring.datasource.username= ${SPRING_DATASOURCE_USERNAME:documentuser}
spring.datasource.password= ${SPRING_DATASOURCE_PASSWORD:documentpass}
spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql= true
spring.jpa.properties.hibernate.format_sql= true
server.port= 8080

storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
storage.access-key=${STORAGE_ACCESS_KEY:paperlessadmin}
storage.secret-key=${STORAGE_SECRET_KEY:paperless-local-secret}
storage.bucket=${STORAGE_BUCKET:documents}
spring.sql.init.mode=always
